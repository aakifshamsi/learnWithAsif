name: Deploy aakif.sham.si Portfolio

on:
  push:
    branches:
      - main
      - "claude/elections-dashboard-ai-*"
    paths:
      - "portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

jobs:
  preflight:
    name: Check prerequisites
    runs-on: ubuntu-latest
    outputs:
      cf_ready: ${{ steps.check.outputs.cf_ready }}
    steps:
      - name: Check required secrets
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::CF_API_TOKEN or CF_ACCOUNT_ID not set — build will run but CF deploy will be skipped."
            echo "cf_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "cf_ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: portfolio
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: portfolio
        run: pnpm typecheck

      - name: Build
        working-directory: portfolio
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: needs.preflight.outputs.cf_ready == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: aakif-portfolio
          directory: portfolio/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name == 'main' && 'main' || github.ref_name }}
          wranglerVersion: "3"

      - name: Skip notice
        if: needs.preflight.outputs.cf_ready == 'false'
        run: echo "::notice::CF Pages deploy skipped — add CF_API_TOKEN and CF_ACCOUNT_ID secrets to enable."
