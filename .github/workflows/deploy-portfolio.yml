name: Deploy aakif.sham.si Portfolio

on:
  push:
    branches:
      - main
      - "claude/elections-dashboard-ai-*"
    paths:
      - "portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-portfolio-${{ hashFiles('portfolio/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-portfolio-

      - name: Install dependencies
        working-directory: portfolio
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: portfolio
        run: pnpm typecheck

      - name: Build
        working-directory: portfolio
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: aakif-portfolio
          directory: portfolio/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name == 'main' && 'main' || github.ref_name }}
          wranglerVersion: "3"
