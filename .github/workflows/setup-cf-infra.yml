name: "Setup CF Infrastructure (run once)"

# Trigger manually from GitHub Actions tab on any device/browser.
# Fill in the inputs, click Run workflow.
on:
  workflow_dispatch:
    inputs:
      cf_access_team_domain:
        description: "CF Access team domain (e.g. yourteam.cloudflareaccess.com). Leave blank to skip."
        required: false
        default: ""
      worker_url:
        description: "Worker URL after deploy (e.g. https://elections-worker.yourname.workers.dev). Used to set VITE_API_URL."
        required: false
        default: ""

jobs:
  setup:
    name: Create CF resources and patch wrangler.toml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@3

      # ── D1 Database ──────────────────────────────────────────────────────────
      - name: Create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Creating D1 database elections-db..."
          OUTPUT=$(wrangler d1 create elections-db 2>&1) || true
          echo "$OUTPUT"

          # Extract database_id from wrangler output
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id = "\K[^"]+' || true)

          # If it already exists, fetch from list
          if [ -z "$DB_ID" ]; then
            echo "DB may already exist — fetching from list..."
            DB_ID=$(wrangler d1 list --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['uuid'] for x in d if x['name']=='elections-db'),''))" || true)
          fi

          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "D1 database_id: $DB_ID"

      # ── KV Namespace ─────────────────────────────────────────────────────────
      - name: Create KV namespace (prod)
        id: kv_prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Creating KV namespace CACHE..."
          OUTPUT=$(wrangler kv namespace create CACHE 2>&1) || true
          echo "$OUTPUT"

          # Extract id from JSON-like line: { binding = "CACHE", id = "abc123" }
          KV_ID=$(echo "$OUTPUT" | grep -oP 'id = "\K[^"]+' | head -1 || true)

          if [ -z "$KV_ID" ]; then
            echo "KV may already exist — fetching from list..."
            KV_ID=$(wrangler kv namespace list --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['id'] for x in d if 'CACHE' in x.get('title','') and 'preview' not in x.get('title','').lower()),''))" || true)
          fi

          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "KV prod id: $KV_ID"

      - name: Create KV namespace (preview)
        id: kv_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Creating KV namespace CACHE (preview)..."
          OUTPUT=$(wrangler kv namespace create CACHE --preview 2>&1) || true
          echo "$OUTPUT"

          KV_PREVIEW_ID=$(echo "$OUTPUT" | grep -oP 'id = "\K[^"]+' | head -1 || true)

          if [ -z "$KV_PREVIEW_ID" ]; then
            echo "KV preview may already exist — fetching from list..."
            KV_PREVIEW_ID=$(wrangler kv namespace list --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['id'] for x in d if 'CACHE' in x.get('title','') and 'preview' in x.get('title','').lower()),''))" || true)
          fi

          echo "kv_preview_id=$KV_PREVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "KV preview id: $KV_PREVIEW_ID"

      # ── R2 Bucket ────────────────────────────────────────────────────────────
      - name: Create R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler r2 bucket create elections-reports 2>&1 || echo "Bucket may already exist — continuing."

      # ── CF Pages project ─────────────────────────────────────────────────────
      - name: Create CF Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages project create elections-dashboard \
            --production-branch main 2>&1 || echo "Pages project may already exist — continuing."

      # ── Patch wrangler.toml ──────────────────────────────────────────────────
      - name: Patch wrangler.toml with real IDs
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          KV_ID: ${{ steps.kv_prod.outputs.kv_id }}
          KV_PREVIEW_ID: ${{ steps.kv_preview.outputs.kv_preview_id }}
        run: |
          TOML="elections-dashboard/apps/worker/wrangler.toml"
          echo "Patching $TOML..."

          if [ -n "$DB_ID" ]; then
            sed -i "s/REPLACE_AFTER_wrangler_d1_create/$DB_ID/g" "$TOML"
            echo "Patched database_id"
          fi

          if [ -n "$KV_ID" ]; then
            # Replace the prod id line (not the preview line)
            sed -i "s/^id = \"REPLACE_AFTER_wrangler_kv_create\"/id = \"$KV_ID\"/" "$TOML"
            echo "Patched KV prod id"
          fi

          if [ -n "$KV_PREVIEW_ID" ]; then
            sed -i "s/REPLACE_AFTER_wrangler_kv_create_preview/$KV_PREVIEW_ID/" "$TOML"
            echo "Patched KV preview_id"
          fi

          echo ""
          echo "=== wrangler.toml after patch ==="
          cat "$TOML"

      # ── Worker secret: CF Access team domain ─────────────────────────────────
      - name: Set CF_ACCESS_TEAM_DOMAIN secret (if provided)
        if: ${{ inputs.cf_access_team_domain != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ inputs.cf_access_team_domain }}" \
            | wrangler secret put CF_ACCESS_TEAM_DOMAIN \
              --name elections-worker 2>&1
          echo "CF_ACCESS_TEAM_DOMAIN set on Worker."

      # ── Commit patched wrangler.toml ─────────────────────────────────────────
      - name: Commit updated wrangler.toml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet elections-dashboard/apps/worker/wrangler.toml; then
            echo "No changes to wrangler.toml (IDs may already have been set)."
          else
            git add elections-dashboard/apps/worker/wrangler.toml
            git commit -m "chore: patch wrangler.toml with CF resource IDs from setup job

https://claude.ai/code/session_01VDpz4LoFNafkQr2Q4AvRXm"
            git push
            echo "wrangler.toml committed and pushed."
          fi

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Print setup summary
        run: |
          echo ""
          echo "============================================================"
          echo " CF Infrastructure setup complete"
          echo "============================================================"
          echo ""
          echo " D1 database_id : ${{ steps.d1.outputs.db_id }}"
          echo " KV prod id     : ${{ steps.kv_prod.outputs.kv_id }}"
          echo " KV preview id  : ${{ steps.kv_preview.outputs.kv_preview_id }}"
          echo ""
          echo " NEXT STEPS (do these from your browser):"
          echo ""
          echo " 1. GitHub repo → Settings → Variables → Actions:"
          echo "    VITE_API_URL     = ${{ inputs.worker_url || 'https://elections-worker.<your-account>.workers.dev' }}"
          echo "    VITE_MONETAG_ZONE_ID  = <from Monetag dashboard>"
          echo "    VITE_MONETAG_DOMAIN   = glizauvo.net"
          echo ""
          echo " 2. Cloudflare Zero Trust dashboard → Access → Applications:"
          echo "    Create self-hosted app for elections-worker.<account>.workers.dev"
          echo "    Enable Google OAuth + GitHub OAuth as identity providers"
          echo "    Policy: protect /api/votes* and /api/reports* (POST)"
          echo ""
          echo " 3. Replace REPLACE_WITH_YOUR_MONETAG_VERIFY_TOKEN in"
          echo "    elections-dashboard/apps/web/index.html (edit on GitHub)"
          echo ""
          echo " 4. Push any change to trigger the deploy workflow."
          echo "============================================================"
