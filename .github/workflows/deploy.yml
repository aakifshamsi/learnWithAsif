name: Deploy Elections Dashboard

on:
  push:
    branches:
      - main
      - 'claude/elections-dashboard-ai-*'
    paths:
      - 'elections-dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  preflight:
    name: Check prerequisites
    runs-on: ubuntu-latest
    outputs:
      cf_ready: ${{ steps.check.outputs.cf_ready }}
    steps:
      - name: Check required secrets and files
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          MISSING=()
          [ -z "$CF_API_TOKEN" ]  && MISSING+=("CF_API_TOKEN")
          [ -z "$CF_ACCOUNT_ID" ] && MISSING+=("CF_ACCOUNT_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Missing secrets: ${MISSING[*]} — build will run but CF deploy steps will be skipped."
            echo "cf_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "cf_ready=true" >> "$GITHUB_OUTPUT"
          fi

          # Verify lockfile exists (required for frozen-lockfile install)
          if [ ! -f elections-dashboard/pnpm-lock.yaml ]; then
            echo "::warning::elections-dashboard/pnpm-lock.yaml not found — switching to --no-frozen-lockfile."
          fi

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: elections-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build shared package
        run: pnpm --filter @elections/shared build

      - name: Typecheck worker
        run: pnpm --filter @elections/worker typecheck

      - name: Apply D1 migrations (remote)
        if: needs.preflight.outputs.cf_ready == 'true'
        run: pnpm --filter @elections/worker migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Worker
        if: needs.preflight.outputs.cf_ready == 'true'
        run: pnpm --filter @elections/worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Skip notice
        if: needs.preflight.outputs.cf_ready == 'false'
        run: echo "::notice::CF deploy skipped — add CF_API_TOKEN and CF_ACCOUNT_ID secrets to enable."

  deploy-web:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [preflight, deploy-worker]
    defaults:
      run:
        working-directory: elections-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build shared package
        run: pnpm --filter @elections/shared build

      - name: Typecheck web
        run: pnpm --filter @elections/web typecheck

      - name: Build web app
        run: pnpm --filter @elections/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MONETAG_ZONE_ID: ${{ vars.VITE_MONETAG_ZONE_ID }}
          VITE_MONETAG_DOMAIN: ${{ vars.VITE_MONETAG_DOMAIN }}

      - name: Deploy to Cloudflare Pages
        if: needs.preflight.outputs.cf_ready == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: elections-dashboard
          directory: elections-dashboard/apps/web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

      - name: Skip notice
        if: needs.preflight.outputs.cf_ready == 'false'
        run: echo "::notice::CF Pages deploy skipped — add CF_API_TOKEN and CF_ACCOUNT_ID secrets to enable."
