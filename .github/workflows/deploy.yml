name: Deploy Elections Dashboard

on:
  push:
    branches:
      - main
      - 'claude/elections-dashboard-ai-*'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elections-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: elections-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @elections/shared build

      - name: Typecheck worker
        run: pnpm --filter @elections/worker typecheck

      - name: Apply D1 migrations (remote)
        run: pnpm --filter @elections/worker migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm --filter @elections/worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    defaults:
      run:
        working-directory: elections-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: elections-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @elections/shared build

      - name: Typecheck web
        run: pnpm --filter @elections/web typecheck

      - name: Build web app
        run: pnpm --filter @elections/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MONETAG_ZONE_ID: ${{ vars.VITE_MONETAG_ZONE_ID }}
          VITE_MONETAG_DOMAIN: ${{ vars.VITE_MONETAG_DOMAIN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: elections-dashboard
          directory: elections-dashboard/apps/web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
